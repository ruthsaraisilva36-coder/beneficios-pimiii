<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beneficios PIM III — HCM y útiles escolares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#E5E9ED;--panel:#fff;--line:#CFD8DF;--line2:#E4EAEF;
  --ink:#17232E;--mut:#66788A;--pri:#12495E;--pri-l:#E3EDF1;
  --ore:#8F6415;--ore-l:#F7EFDC;--bad:#8E3527;--bad-l:#F7E7E4;--ok:#2C6349;
  --fs:14px;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"IBM Plex Sans","Segoe UI",Roboto,-apple-system,sans-serif;
  font-size:var(--fs);color:var(--ink);background:var(--bg);line-height:1.45;
  font-variant-numeric:tabular-nums;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
.app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}

/* ---- rail ---- */
.rail{background:var(--pri);color:#DCE7EC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.14)}
.brand b{display:block;color:#fff;font-size:15px;font-weight:600;letter-spacing:-.2px}
.brand span{display:block;font-size:11.5px;color:#9FBAC6;margin-top:2px}
.nav{padding:10px 8px;flex:1;overflow:auto}
.nav button{display:flex;width:100%;align-items:baseline;gap:8px;padding:8px 10px;border-radius:5px;
  color:#C6D8E0;font-size:13.5px;text-align:left}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:#fff;color:var(--pri);font-weight:600}
.nav button em{margin-left:auto;font-style:normal;font-size:11.5px;opacity:.75}
.nav hr{border:none;border-top:1px solid rgba(255,255,255,.14);margin:10px 10px}
.corte{padding:12px 16px;border-top:1px solid rgba(255,255,255,.14);font-size:11.5px;color:#9FBAC6}
.corte input{width:100%;margin-top:5px;padding:5px 7px;border:1px solid rgba(255,255,255,.25);
  border-radius:4px;background:rgba(0,0,0,.18);color:#fff;font-size:12.5px}

/* ---- main ---- */
.main{padding:22px 26px 60px;max-width:1180px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:16px}
h1{font-size:20px;font-weight:600;letter-spacing:-.3px}
.sub{color:var(--mut);font-size:13px;margin-top:2px;max-width:66ch}
.hide{display:none!important}

.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar input[type=search]{flex:1;min-width:230px;padding:9px 12px;border:1px solid var(--line);
  border-radius:6px;background:var(--panel)}
.bar input[type=search]:focus{outline:2px solid var(--pri);outline-offset:-1px}
.bar select{padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:12px 14px}
.card b{display:block;font-size:23px;font-weight:600;letter-spacing:-.5px}
.card span{font-size:12px;color:var(--mut)}
.card.w{background:var(--ore-l);border-color:#E6D3A8}
.card.w b{color:var(--ore)}

table{width:100%;border-collapse:collapse;background:var(--panel);
  border:1px solid var(--line);border-radius:7px;overflow:hidden}
th{background:#F4F7F9;text-align:left;font-size:11.5px;font-weight:600;color:var(--mut);
  padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr.sel{background:var(--pri-l)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#F4F8FA}
.num{text-align:right}
.wrap{display:grid;grid-template-columns:1fr 372px;gap:16px;align-items:start}
@media(max-width:1080px){.wrap{grid-template-columns:1fr}.app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}
  .nav{display:flex;flex-wrap:wrap;flex:1}.nav hr{display:none}.corte{border:none}}

.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11.5px;
  background:#EDF1F4;color:var(--mut);white-space:nowrap}
.tag.p{background:var(--pri-l);color:var(--pri)}
.tag.o{background:var(--ore-l);color:var(--ore)}
.tag.b{background:var(--bad-l);color:var(--bad)}
.tag.g{background:#E4EFE9;color:var(--ok)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:16px 17px;
  position:sticky;top:18px}
.panel h2{font-size:16px;font-weight:600;letter-spacing:-.2px}
.panel .meta{color:var(--mut);font-size:12.5px;margin:3px 0 12px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:3px 10px;font-size:12.5px;margin-bottom:14px}
.kv dt{color:var(--mut)}
.fam{border-top:1px solid var(--line2);padding:9px 0}
.fam:last-child{padding-bottom:0}
.fam .n{font-weight:600;font-size:13px}
.fam .d{color:var(--mut);font-size:12px;margin-top:1px}
.fam .t{margin-top:4px;display:flex;gap:5px;flex-wrap:wrap}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:7px;
  padding:28px;text-align:center;color:var(--mut)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 13px;font-size:13px}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:#0E3B4C}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:12px}
.dl article{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:16px}
.dl h3{font-size:14.5px;font-weight:600;margin-bottom:5px}
.dl p{font-size:12.5px;color:var(--mut);margin-bottom:12px}
.note{background:var(--ore-l);border:1px solid #E6D3A8;border-radius:7px;padding:12px 14px;
  font-size:12.5px;margin-bottom:16px;color:#5F440E}
.chk{width:15px;height:15px;accent-color:var(--pri);cursor:pointer}
.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
  font-size:12px;color:var(--mut)}

.modal{position:fixed;inset:0;background:rgba(14,28,38,.44);display:grid;place-items:center;
  padding:20px;z-index:50}
.modal .box{background:var(--panel);border-radius:9px;padding:20px 22px;width:min(620px,100%);
  max-height:88vh;overflow:auto;box-shadow:0 18px 44px rgba(11,32,45,.28)}
.modal h2{font-size:17px;font-weight:600;letter-spacing:-.2px}
.modal .meta{color:var(--mut);font-size:12.5px;margin:2px 0 15px}
.modal .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.modal label{font-size:12.5px;color:var(--mut);display:block}
.modal input,.modal select{width:100%;margin-top:3px;padding:8px 10px;border:1px solid var(--line);
  border-radius:6px;background:var(--panel);color:var(--ink);font-size:13.5px}
.modal input:focus,.modal select:focus{outline:2px solid var(--pri);outline-offset:-1px}
.modal .err{color:var(--bad);font-size:12.5px;min-height:17px;margin-top:9px}
.modal .acc{display:flex;gap:8px;align-items:center;margin-top:4px}
.btn.del{border-color:#DDBDB6;color:var(--bad)}
.btn.del:hover{background:var(--bad-l);border-color:var(--bad);color:var(--bad)}
@media(max-width:560px){.modal .grid{grid-template-columns:1fr}}

.modal label.sw{display:flex;gap:9px;align-items:flex-start;background:var(--ore-l);
  border:1px solid #E6D3A8;border-radius:6px;padding:10px 12px;color:#5F440E;line-height:1.4}
.modal label.sw input{width:16px;height:16px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--ore)}
.modal label.sw b{font-weight:600}

/* sesión y estado de guardado */
.entrada{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.entrada .caja{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:26px 26px 22px;width:min(380px,100%);box-shadow:0 12px 34px rgba(11,32,45,.10)}
.entrada h1{font-size:19px;font-weight:600;letter-spacing:-.3px}
.entrada p.s{color:var(--mut);font-size:12.5px;margin:3px 0 18px}
.entrada label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:11px}
.entrada input{width:100%;margin-top:3px;padding:9px 11px;border:1px solid var(--line);
  border-radius:6px;font-size:14px}
.entrada input:focus{outline:2px solid var(--pri);outline-offset:-1px}
.entrada button{width:100%;margin-top:6px}
.entrada .msg{font-size:12.5px;color:var(--bad);min-height:18px;margin-top:9px}
.estado{position:fixed;right:16px;bottom:16px;background:var(--pri);color:#fff;font-size:12.5px;
  padding:7px 13px;border-radius:99px;box-shadow:0 6px 18px rgba(11,32,45,.22);z-index:60}
.estado:empty{display:none}
.estado.ok{background:var(--ok)}
.estado.err{background:var(--bad)}
</style>
</head>

<div class="entrada" id="entrada">
  <div class="caja">

    <p class="s">HCM y útiles escolares · Gestión Humana</p>

<div class="app hide" id="app">

  <div class="user"><div class="av">RS</div>
    <div class="who"><b>Ruth Silva</b><span id="quien">Gestión Humana</span></div>

</nav>
<div class="main" id="main"></div>
</div>

<script type="module">
/* ============================================================
   Capa de datos — Firebase (Auth + Firestore)
   ============================================================ */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc, addDoc,
         query, orderBy, limit, serverTimestamp, writeBatch }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app  = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db   = getFirestore(app);

export const DB = {
  auth, db,
  entrar:(correo,clave)=>signInWithEmailAndPassword(auth,correo,clave),
  salir:()=>signOut(auth),
  sesion:cb=>onAuthStateChanged(auth,cb),

  async cargar(){
    const [t,a,m,j] = await Promise.all([
      getDocs(collection(db,'trabajadores')),
      getDocs(collection(db,'apoyos')),
      getDocs(query(collection(db,'movimientos'),orderBy('fecha','desc'),limit(300))),
      getDocs(collection(db,'jornadas'))
    ]);
    return {
      trabajadores:t.docs.map(d=>({...d.data(),ced:d.id})),
      apoyos:a.docs.map(d=>({...d.data(),_id:d.id})),
      movimientos:m.docs.map(d=>({...d.data(),_id:d.id})),
      jornadas:Object.fromEntries(j.docs.map(d=>[d.id,d.data()]))
    };
  },

  guardarTrabajador(t){
    const {_k,...limpio}=t;
    return setDoc(doc(db,'trabajadores',t.ced),{...limpio,actualizado:serverTimestamp()});
  },
  borrarTrabajador:ced=>deleteDoc(doc(db,'trabajadores',ced)),

  async guardarApoyo(a){
    const {_id,...limpio}=a;
    if(_id){ await setDoc(doc(db,'apoyos',_id),limpio); return _id; }
    const r=await addDoc(collection(db,'apoyos'),limpio); return r.id;
  },
  borrarApoyo:id=>deleteDoc(doc(db,'apoyos',id)),

  async guardarMovimiento(m){
    const r=await addDoc(collection(db,'movimientos'),m); return r.id;
  },
  borrarMovimiento:id=>deleteDoc(doc(db,'movimientos',id)),

  guardarJornada:(anio,datos)=>setDoc(doc(db,'jornadas',String(anio)),datos),

  /* carga inicial de la base: 997 trabajadores en lotes de 400 */
  async cargaInicial(lista,avisar){
    let n=0;
    for(let i=0;i<lista.length;i+=400){
      const lote=writeBatch(db);
      lista.slice(i,i+400).forEach(t=>{
        const {_k,...limpio}=t;
        lote.set(doc(db,'trabajadores',t.ced),limpio);
      });
      await lote.commit();
      n+=Math.min(400,lista.length-i);
      avisar&&avisar(n,lista.length);
    }
    return n;
  }
};


/* ---- núcleo de la aplicación ---- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let CORTE=new Date('2026-09-04T12:00:00');
let ENT={};                // entregas de la jornada en curso
let CONST={};              // constancias de estudio marcadas
let ANIO=new Date().getFullYear();
let JORNADAS={};
let VISTA='trab', SEL=null;

const edad=f=>{if(!f)return null;const d=new Date(f+'T12:00:00');let e=CORTE.getFullYear()-d.getFullYear();
  const m=CORTE.getMonth()-d.getMonth();if(m<0||(m===0&&CORTE.getDate()<d.getDate()))e--;return e;};
const fdate=f=>f?f.split('-').reverse().join('/'):'—';
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- reglas del beneficio ---------- */
// Útiles: hasta 17 automático · 18 y 19 solo con constancia de estudio · 20+ fuera
function utiles(h){
  if(!h.par.startsWith('HIJO') && !h.apoyo) return null;
  const e=edad(h.fnac);
  if(e===null) return {est:'sin fecha',cls:''};
  if(e<3)  return {est:'aún no aplica',cls:'',e};
  if(e<=16) return {est:'con derecho',cls:'g',e};
  if(e===17) return {est:'último año',cls:'o',e};
  if(e<=19) return {est: CONST[h.doc||h.nom] ? 'con derecho' : 'requiere constancia', cls: CONST[h.doc||h.nom]?'g':'o', e};
  return {est:'fuera por edad',cls:'',e};
}
const conDerecho=h=>{const u=utiles(h);return u&&(u.est==='con derecho'||u.est==='último año');};
const sinTallas=h=>conDerecho(h)&&(!h.t||!h.t.fr||!h.t.pa||!h.t.ca);

/* ---------- índices ---------- */
let MOV=[];                                 // bitácora de movimientos
const clave=t=>norm(t.nom+' '+t.ced+' '+t.cargo+' '+t.fam.map(f=>f.nom).join(' '));
DATA.forEach(t=>t._k=clave(t));
const activo=t=>t.est!=='Egresado'&&t.est!=='Suspendido';
const ACT=()=>DATA.filter(activo);
const FUERA=()=>DATA.filter(t=>!activo(t));
const hijos=()=>[
  ...ACT().flatMap(t=>t.fam.map((f,i)=>({...f,t_:t,_i:i}))
    .filter(f=>f.par.startsWith('HIJO')||f.apoyo)),
  ...EXT.map((f,i)=>({...f,t_:SINTRAB,_i:i,ext:true}))];
const SINTRAB={ced:'',nom:'Sin trabajador vinculado',ubic:'—',cargo:'',fam:[]};
let EXT=[];                                 // apoyos a personas ajenas a la empresa
const apoyos=()=>[
  ...ACT().flatMap(t=>t.fam.map((f,i)=>({...f,t_:t,_i:i})).filter(f=>f.apoyo)),
  ...EXT.map((f,i)=>({...f,t_:SINTRAB,_i:i,ext:true}))];
const asegurables=t=>1+t.fam.filter(f=>!f.apoyo).length;
function movimiento(t,tipo,estado,fecha,motivo){
  const antes=t.est; t.est=estado;
  const m={ced:t.ced,nom:t.nom,tipo,antes,despues:estado,fecha:fecha||hoyISO(),motivo:motivo||''};
  MOV.unshift(m); guardar(t);
  DB.guardarMovimiento(m).then(id=>m._id=id).catch(avisoError);
}

const op=(vals,labels,cur)=>vals.map((v,i)=>`<option value="${v}" ${v===cur?'selected':''}>${labels[i]||v}</option>`).join('');

function ficha(t){
  if(!t) return '';
  const orden={'CÓNYUGE':0,'HIJO':1,'HIJO DISCAPACITADO':1,'MADRE':2,'PADRE':3};
  return `<div class="panel">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
      <div><h2>${esc(t.nom)}</h2><p class="meta">${t.ced} · ${esc(t.cargo)}</p></div>
      <button class="btn ed-t" data-c="${t.ced}" style="padding:4px 9px;font-size:12px;flex:0 0 auto">Editar</button>
    </div>
    <dl class="kv">
      <dt>Ubicación</dt><dd>${t.ubic}</dd>
      <dt>Gerencia</dt><dd>${esc(t.ger)||'—'}</dd>
      <dt>Nómina</dt><dd>${t.nomina} · ${t.est}</dd>
      <dt>Ingreso</dt><dd>${fdate(t.fing)}</dd>
      <dt>Teléfono</dt><dd>${esc(t.tel)||'—'}</dd>
    </dl>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
      <b style="font-size:12.5px;color:var(--mut);font-weight:500">Grupo familiar</b>
      <button class="btn add-f" data-c="${t.ced}" style="padding:3px 8px;font-size:12px">Agregar familiar</button>
    </div>
    ${t.fam.length?t.fam.slice().sort((a,b)=>(orden[a.par]??9)-(orden[b.par]??9)||(a.fnac||'').localeCompare(b.fnac||''))
      .map(f=>{const u=utiles(f);const e=edad(f.fnac);
      const ix=t.fam.indexOf(f);
      return `<div class="fam">
        <div style="display:flex;justify-content:space-between;gap:8px">
          <div class="n">${esc(f.nom)}</div>
          <button class="btn ed-f" data-c="${t.ced}" data-i="${ix}" style="padding:2px 7px;font-size:11.5px;flex:0 0 auto">Editar</button>
        </div>
        <div class="d">${f.par.toLowerCase()} · ${e!==null?e+' años':'sin fecha'} · ${f.doc?f.doc:'sin documento'}${f.niv?' · '+f.niv.toLowerCase():''}</div>
        <div class="t">
          ${u&&u.est!=='aún no aplica'?`<span class="tag ${u.cls}">útiles: ${u.est}</span>`:''}
          ${f.t&&f.t.fr?`<span class="tag">franela ${f.t.fr} · pantalón ${f.t.pa} · calzado ${f.t.ca}</span>`:''}
          ${sinTallas(f)?'<span class="tag b">faltan tallas</span>':''}
          ${!f.doc?'<span class="tag b">falta documento</span>':''}
          ${f.apoyo?'<span class="tag o">apoyo institucional</span>':''}
          ${f.cruz?'<span class="tag b">declarado por dos trabajadores</span>':''}
        </div></div>`}).join('')
      :'<div class="empty" style="padding:18px">Sin carga familiar registrada.</div>'}
  </div>`;
}

/* ---------- vista: recaudos ---------- */
function recaudos(){
  const L=[];
  ACT().forEach(t=>{
    if(!t.fam.length){L.push({t,tipo:'Sin carga familiar registrada',quien:'—',det:'Solicitar la planilla de carga familiar'});return;}
    t.fam.forEach((f,i)=>{
      if(!f.doc) L.push({t,i,tipo:'Falta documento',quien:f.nom,det:f.par.startsWith('HIJO')?'Partida de nacimiento o cédula':'Cédula'});
      else if(f.doc===t.ced) L.push({t,i,tipo:'Documento a verificar',quien:f.nom,det:'Está registrada la cédula del titular'});
      if(sinTallas(f)) L.push({t,i,tipo:'Faltan tallas',quien:f.nom,det:'Franela, pantalón y calzado'});
      const u=utiles(f);
      if(u&&u.est==='requiere constancia') L.push({t,i,tipo:'Falta constancia de estudio',quien:f.nom,det:`Tiene ${u.e} años`});
    });
  });
  return L;
}

  const tipos=[...new Set(L.map(x=>x.tipo))];

  main(`
  <div class="head"><div><h1>Recaudos pendientes</h1>
    <p class="sub">Lo que falta por completar en los expedientes. Es su lista de trabajo para pedir documentos.</p></div>
    <button class="btn" id="dl-rec">Descargar lista</button></div>
  <div class="cards">
    ${tipos.map(t=>`<div class="card ${t.startsWith('Falta')?'w':''}"><b>${L.filter(x=>x.tipo===t).length}</b><span>${t.toLowerCase()}</span></div>`).join('')}
  </div>
  <div class="bar">
    <input type="search" id="q" placeholder="Buscar trabajador o familiar" value="${esc($('#q')?.value||'')}">
    <select id="f-tp">${op(['',...tipos],['Todos los pendientes'],tp)}</select>
  </div>
  <table><thead><tr><th>Cédula</th><th>Trabajador</th><th>Pendiente</th><th>De quién</th><th>Qué se pide</th><th></th></tr></thead>
  <tbody>${F.slice(0,300).map(x=>`<tr><td>${x.t.ced}</td><td>${esc(x.t.nom)}</td>
    <td><span class="tag ${x.tipo.startsWith('Falta')?'b':'o'}">${x.tipo}</span></td>
    <td>${esc(x.quien)}</td><td>${esc(x.det)}</td>
    <td>${x.i!==undefined?`<button class="btn ef" data-c="${x.t.ced}" data-i="${x.i}" style="padding:3px 8px;font-size:12px">Corregir</button>`
      :`<button class="btn et" data-c="${x.t.ced}" style="padding:3px 8px;font-size:12px">Ver ficha</button>`}</td></tr>`).join('')}</tbody></table>
  ${F.length>300?`<p class="foot">Mostrando 300 de ${F.length}.</p>`:''}`);
  $('#q').oninput=()=>{const v=$('#q').value;vRecaudos();$('#q').value=v;$('#q').focus();$('#q').setSelectionRange(v.length,v.length);};
  $('#f-tp').onchange=vRecaudos;

  main(`
  <div class="head"><div><h1>Útiles escolares</h1>

    <th>Trabajador</th><th>Estado</th><th>Estudia</th><th></th></tr></thead>

    <td>${esc(h.nom)}</td><td class="num">${x.u.e}</td><td>${esc(h.niv)||'—'}</td>
    <td>${h.t&&h.t.fr?`${h.t.fr} · ${h.t.pa} · ${h.t.ca}`:'<span class="tag b">faltan</span>'}</td>
    <td>${esc(h.t_.nom)}${h.t_.ced?`<div style="color:var(--mut);font-size:12px">${h.t_.ced}</div>`:''}</td>
    <td><span class="tag ${x.u.cls}">${x.u.est}</span></td>
    <td>${x.u.e>=18&&x.u.e<=19?`<input type="checkbox" class="chk cst" data-k="${esc(k)}" ${CONST[k]?'checked':''}>`:'—'}</td>
    <td><button class="btn ef" data-c="${h.ext?'EXT':h.t_.ced}" data-i="${h._i}" style="padding:3px 8px;font-size:12px">Corregir</button></td>

  $('#f-st').onchange=vUtiles;
  $$('.cst').forEach(c=>c.onchange=()=>{CONST[c.dataset.k]=c.checked;guardarJornada();vUtiles();});

/* ---------- utilidades ---------- */
function csv(nombre,cab,filas){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const txt='\ufeff'+[cab.map(q).join(';'),...filas.map(f=>f.map(q).join(';'))].join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download=nombre+'_'+CORTE.toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href);
}

/* ---------- edición ---------- */
function modal(titulo,sub,cuerpo,onGuardar,extra){
  const d=document.createElement('div');
  d.className='modal';
  d.innerHTML=`<div class="box"><h2>${esc(titulo)}</h2><p class="meta">${esc(sub)}</p>
    <div class="grid">${cuerpo}</div>
    <p class="err" id="m-err"></p>
    <div class="acc">
      ${extra||''}
      <span style="flex:1"></span>
      <button class="btn" id="m-no">Cancelar</button>
      <button class="btn pri" id="m-ok">Guardar cambios</button>
    </div></div>`;
  document.body.appendChild(d);
  const cerrar=()=>d.remove();
  d.querySelector('#m-no').onclick=cerrar;
  d.onclick=e=>{if(e.target===d)cerrar();};
  document.addEventListener('keydown',function esc2(e){
    if(e.key==='Escape'){cerrar();document.removeEventListener('keydown',esc2);}});
  d.querySelector('#m-ok').onclick=()=>{ if(onGuardar(d,cerrar)!==false) cerrar(); };
  return d;
}

/* ---------- anular un movimiento ---------- */
function anular(i){
  const m=MOV[i]; const t=DATA.find(x=>x.ced===m.ced);
  if(!confirm('¿Anular el movimiento de '+m.nom+'?\nEl trabajador vuelve a la situación anterior.')) return;
  if(m.tipo==='Ingreso'){
    const k=DATA.indexOf(t); if(k>=0) DATA.splice(k,1);
    DB.borrarTrabajador(m.ced).catch(avisoError);
  } else if(t){ t.est=m.antes; guardar(t); }
  if(m._id) DB.borrarMovimiento(m._id).catch(avisoError);
  MOV.splice(i,1); render();
}

      if(!nom){dd.querySelector('#m-err').textContent='Hace falta el nombre.';return false;}
      const fr=g(dd,'x-fr'),pa=g(dd,'x-pa'),ca=g(dd,'x-ca');
      const reg={par:g(dd,'x-par'),doc:g(dd,'x-doc').replace(/\D/g,''),nom,sexo:g(dd,'x-sexo'),
        fnac:g(dd,'x-fnac')||null,niv:g(dd,'x-niv'),apoyo:true,obs:'',cruz:false,
        solic:g(dd,'x-solic'),aut:g(dd,'x-aut')};
      if(fr||pa||ca) reg.t={fr,pa,ca};
      if(nuevo){ EXT.push(reg); guardarApoyo(reg); } else { reg._id=EXT[ix]._id; EXT[ix]=reg; guardarApoyo(reg); }
      render();
    }, quitar);
  if(!nuevo) d.querySelector('#m-del').onclick=()=>{
    if(!confirm('¿Quitar a '+f.nom+' de la base de apoyos?')) return;
    const fuera=EXT.splice(ix,1)[0]; if(fuera._id) DB.borrarApoyo(fuera._id).catch(avisoError);
    d.remove(); render();
  };
}


/* ---- arranque ---- */

/* ============================================================
   Arranque, sesión y sincronización
   ============================================================ */
let GUARDANDO=0;
function estado(txt,cls){
  const e=$('#estado'); if(!e) return;
  e.textContent=txt||''; e.className='estado '+(cls||'');
}
function avisoError(err){
  console.error(err);
  estado('No se pudo guardar. Revise la conexión.','err');
}
function marcaGuardado(p){
  GUARDANDO++; estado('Guardando…','');
  p.then(()=>{ if(--GUARDANDO===0) estado('Cambios guardados','ok'); })
   .catch(e=>{ GUARDANDO--; avisoError(e); });
}
const guardar      = t => marcaGuardado(DB.guardarTrabajador(t));
const guardarApoyo = a => marcaGuardado(DB.guardarApoyo(a).then(id=>{ if(!a._id) a._id=id; }));

let tJor=null;
function guardarJornada(){
  clearTimeout(tJor);
  tJor=setTimeout(()=>marcaGuardado(DB.guardarJornada(ANIO,{entregas:ENT,constancias:CONST})),700);
}

/* ---------- sesión ---------- */
function pantallaEntrada(msg){
  $('#app').classList.add('hide');
  $('#entrada').classList.remove('hide');
  $('#e-msg').textContent=msg||'';
}
async function entrar(){
  const c=$('#e-correo').value.trim(), k=$('#e-clave').value;
  if(!c||!k){ $('#e-msg').textContent='Escriba el correo y la contraseña.'; return; }
  $('#e-ok').disabled=true; $('#e-msg').textContent='Entrando…';
  try{ await DB.entrar(c,k); }
  catch(e){
    $('#e-ok').disabled=false;
    $('#e-msg').textContent = e.code==='auth/invalid-credential'
      ? 'El correo o la contraseña no coinciden.'
      : 'No se pudo entrar: '+(e.code||e.message);
  }
}

async function iniciar(usuario){
  $('#entrada').classList.add('hide');
  $('#app').classList.remove('hide');
  $('#quien').textContent=usuario.email;
  estado('Cargando la base…','');
  try{
    const d=await DB.cargar();
    DATA.length=0; d.trabajadores.forEach(t=>{ t.fam=t.fam||[]; t._k=clave(t); DATA.push(t); });
    EXT=d.apoyos; MOV=d.movimientos;
    JORNADAS=d.jornadas;
    const j=JORNADAS[ANIO]||{}; ENT=j.entregas||{}; CONST=j.constancias||{};
    if(!DATA.length){ estado('La base está vacía','err'); primeraCarga(); return; }
    estado('','');
    render();
  }catch(e){ avisoError(e); }
}

/* ---------- carga inicial ---------- */
function primeraCarga(){
  $('#main').innerHTML=`
    <div class="head"><div><h1>Cargar la base por primera vez</h1>
    <p class="sub">Todavía no hay trabajadores en la base. Este paso sube los ${BASE_INICIAL.length}
    trabajadores del PIM III con su grupo familiar. Se hace una sola vez.</p></div></div>
    <div class="panel" style="position:static;max-width:560px">
      <p style="font-size:13px;margin-bottom:14px">Se van a crear ${BASE_INICIAL.length} registros
      de trabajador con ${BASE_INICIAL.reduce((a,t)=>a+t.fam.length,0)} familiares.</p>
      <button class="btn pri" id="go-carga">Cargar la base</button>
      <p id="p-carga" style="font-size:12.5px;color:var(--mut);margin-top:12px"></p>
    </div>`;
  $('#go-carga').onclick=async()=>{
    $('#go-carga').disabled=true;
    try{
      await DB.cargaInicial(BASE_INICIAL,(n,t)=>$('#p-carga').textContent=`Subidos ${n} de ${t}…`);
      $('#p-carga').textContent='Base cargada. Recargando…';
      setTimeout(()=>location.reload(),900);
    }catch(e){ $('#go-carga').disabled=false; avisoError(e);
      $('#p-carga').textContent='No se pudo cargar: '+(e.code||e.message); }
  };
}

/* ---------- enlaces fijos ---------- */
$$('.nav button').forEach(b=>b.onclick=()=>ir(b.dataset.v));
$('#corte').onchange=e=>{ if(e.target.value){ CORTE=new Date(e.target.value+'T12:00:00'); render(); } };
$('#salir').onclick=salir;
$('#e-ok').onclick=entrar;
$('#e-clave').onkeydown=e=>{ if(e.key==='Enter') entrar(); };

DB.sesion(u=>{ u ? iniciar(u) : pantallaEntrada(); });

</script>
